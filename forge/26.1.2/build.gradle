plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = project.mod_version
group = project.maven_group
base.archivesName = 'bedprotect-forge'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }

        register('client') {
            args '--mixin.config', 'bedprotect.mixins.json'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral {
    	content { excludeGroup 'net.minecraft' }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

jar {
    manifest.attributes('MixinConfigs': 'bedprotect.mixins.json')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
