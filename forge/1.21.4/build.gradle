plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = 'bedprotect-forge'

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    reobf = false
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            args '-mixin.config=bedprotect.mixins.json'
        }
    }
}

repositories {
    mavenCentral {
    	content { excludeGroup 'net.minecraft' }
    }
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

jar {
    manifest.attributes('MixinConfigs': 'bedprotect.mixins.json')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
